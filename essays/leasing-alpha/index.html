<div style="max-width: 960px; margin: 0 auto; padding: clamp(64px, 8vw, 112px) 32px clamp(48px, 6vw, 72px); display: flex; flex-direction: column; gap: 28px;">

<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #2E4BE0;">Technology · November 2026 · 6 min read</p>
<h1 id="essay-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(44px, 6vw, 84px); line-height: 1.02; letter-spacing: -0.02em;">Technology-Powered Leasing Is Where the Alpha Is</h1>
<div style="display: flex; align-items: center; gap: 16px; padding-top: 8px;">
<img src="/assets/daniel-avatar.jpg" alt="Daniel Abrahams" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 1px solid #0A0F33;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<p style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 18px;">Daniel Abrahams</p>
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #55524C;">Founder &amp; CEO, DLA Real Estate</p>
</div>
</div>
</div>
</header>
<div style="max-width: 720px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 32px clamp(72px, 8vw, 112px); display: flex; flex-direction: column; gap: 26px;">
<p style="margin: 0; font-size: clamp(22px, 2vw, 26px); line-height: 1.55; color: #0A0F33;">In real estate, people like to say you make your money when you buy. There's truth in that. A good basis gives you room for mistakes. But in the buildings we own, multi-tenant industrial, flex and medical office, we've learned something just as important.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">You make your money when you lease.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">And the way most of the industry still leases small commercial space is slow, manual and leaves real value on the table. That gap is where we think the alpha is: the return above what the market gives you just for owning the asset.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">The math of a dark suite</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Start with the simplest number in our business: the cost of a vacant suite.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Picture a 2,500-square-foot unit in a multi-tenant building. When the tenant moves out, the clock starts. Every month the suite is empty is a month of rent you never get back. You're also still paying taxes, insurance and common area costs on that space with no tenant to share them.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Now imagine two owners with identical suites. The first relies on a sign in the window and a listing that goes up a few weeks later. It takes six months to sign a new tenant. The second has a marketing campaign live the day the old tenant gives notice, answers every inquiry within the hour, tours prospects within a day and signs a new lease in two months.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Same building. Same rent. The second owner just collected four more months of income. Across a building with twenty or thirty suites rolling over a few years, those months add up to a meaningful share of the building's value. And when the building is eventually sold, buyers pay for income. Every month of avoided vacancy shows up again in the sale price.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">That's leasing alpha. It doesn't require a better market. It requires a better process.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">How small buildings get leased today</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">In the segment we buy, the typical leasing process looks like this. The owner or a part-time property manager notices a vacancy. Someone calls a local broker. The broker adds the suite to a listing site, maybe sends an email blast to other brokers, and puts up a sign. Inquiries arrive by phone, email and text, often to different people. Some get answered the same day. Many get answered next week. A few never get answered at all.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">There's no single record of who asked about the space, what they needed, or why they didn't sign. Asking rents are set by gut feel and a few phone calls. Nobody can tell you how many people looked at the listing, how many called, how many toured, or where in that funnel the building is losing them.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">For a large institutional building, this level of process would be unacceptable. For a $5 million building with fifteen tenants, it's normal. That's exactly why it's an opportunity.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">What technology-powered leasing looks like</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When we say DLA is a technology-powered investment platform, leasing is where that phrase gets concrete. Here is what we do differently.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">We market like a consumer business.</strong> For our buildings we run targeted digital ads aimed at the businesses most likely to need the space: contractors, medical practices, service companies, small e-commerce brands. We maintain listings on the major commercial sites, build simple property websites with real photos, and put out flyers to the local broker community. The goal is that every qualified prospect in the area sees the space within days of it becoming available, not months.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">We answer fast.</strong> Speed to response is the most underrated number in leasing. A small business owner looking for space is usually calling several buildings at once. The first owner who calls back, answers the questions and offers a tour time usually wins. We treat inquiries like sales leads, because that's what they are.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">We track every lead.</strong> Every inquiry, tour and proposal goes into one system. That means we know how many people asked about a suite, what size and budget they had, which marketing channel brought them in and why deals fell through. Over time, that data tells us how to price, how to market and what improvements actually move the needle.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">We price with data, not instinct.</strong> Setting the asking rent is one of the most consequential decisions an owner makes. Too high, and the suite sits. Too low, and you leave money on the table for the life of the lease. We gather what we can on asking rents, recent deals and vacancy across the submarket so our pricing reflects the market as it is today, not as it was when the last lease was signed.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">We remove friction for tenants.</strong> Small business owners don't have time for weeks of back-and-forth. Clear floor plans, quick answers on use and zoning, simple lease documents and fast turnaround on proposals all shorten the time from first call to signed lease.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">The products we're building</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We think this approach shouldn't stop at our own buildings. That's why we're building software for the wider market, all coming soon.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Signal DLA</strong> is designed to be a Bloomberg Terminal for leasing: a view of asking rents, vacancy and deal activity by submarket, so owners and tenants can see the market as it moves instead of relying on stale reports and secondhand opinions.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Tenant Bio</strong> is a verified tenant profile. Today, every time a small business applies for space, it starts from scratch: financials, references, business history. A verified profile lets a good tenant build it once and use it everywhere, and lets landlords say yes faster to tenants they can trust.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Class X</strong> is our marketplace for matching tenants to space. Instead of a business owner searching listing sites and making dozens of calls, Class X is built to take what a business needs and match it with buildings that fit.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Each of these products comes from a problem we deal with in our own buildings. We built them because we needed them.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why this creates alpha, not just efficiency</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">It's fair to ask whether this is just good management dressed up in technology language. Partly, yes. But the effect on returns is real, for three reasons.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Vacancy compounds.</strong> Shorter downtime on each turnover raises income every year of the hold, and that higher income gets capitalized into a higher sale price at the exit. A small improvement in leasing speed has an outsized effect on the final result.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Better pricing compounds too.</strong> When asking rents are set with good information, each new lease starts from a stronger base, and future renewals build on it. Over a three-to-five-year business plan, that raises the income a buyer will underwrite.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Data improves decisions.</strong> Knowing which suites lease fastest, which improvements tenants value and which marketing channels deliver lets us spend capital where it earns the most. In a segment where most owners are flying blind, simply knowing more is an edge.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">The bigger picture</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Commercial real estate still runs largely on PDFs, phone calls and relationships. Relationships will always matter. We have no interest in replacing the broker who knows every tenant in a submarket, and we work with them every day. But the tools around those relationships are decades behind what other industries take for granted.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We think the owners who close that gap will lease faster, price better and sell for more. In the messy middle, where most competitors still run their buildings the way they did twenty years ago, that advantage is especially large.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">That's why technology isn't a side project at DLA. It's part of how we underwrite every acquisition. When we look at a building, we ask what it's worth today, and then we ask what it's worth once it's leased the way we lease.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The difference between those two numbers is the opportunity.</p>
<p style="margin: 24px 0 0; padding-top: 28px; border-top: 1.5px solid #0A0F33; font-size: 17px; line-height: 1.6; color: #55524C;">Have a building in the messy middle, or want to invest alongside us? <a href="/contact/" style="color: #2E4BE0;">Get in touch</a>.</p>
</div>
