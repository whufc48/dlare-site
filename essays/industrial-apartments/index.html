<article aria-labelledby="essay-title">
<header style="border-bottom: 1px solid #0A0F33;">
<div style="max-width: 960px; margin: 0 auto; padding: clamp(64px, 8vw, 112px) 32px clamp(48px, 6vw, 72px); display: flex; flex-direction: column; gap: 28px;">
<a href="/essays/" style="align-self: flex-start; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 10px 0;">← All essays</a>
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #2E4BE0;">Market letter · November 2026 · 6 min read</p>
<h1 id="essay-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(44px, 6vw, 84px); line-height: 1.02; letter-spacing: -0.02em;">Small-Bay Industrial Is the New Apartment Building</h1>
<div style="display: flex; align-items: center; gap: 16px; padding-top: 8px;">
<img src="/assets/daniel-avatar.jpg" alt="Daniel Abrahams" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 1px solid #0A0F33;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<p style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 18px;">Daniel Abrahams</p>
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #55524C;">Founder &amp; CEO, DLA Real Estate</p>
</div>
</div>
</div>
</header>
<div style="max-width: 720px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 32px clamp(72px, 8vw, 112px); display: flex; flex-direction: column; gap: 26px;">
<p style="margin: 0; font-size: clamp(22px, 2vw, 26px); line-height: 1.55; color: #0A0F33;">Ask most investors what they think of when they hear "industrial real estate" and they'll describe a distribution center: a million square feet off an interstate, forty-foot ceilings, one tenant with a logo you'd recognize, a ten-year lease.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">That's a fine asset. It is not what we buy.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We buy small-bay industrial: buildings divided into units of roughly 1,000 to 5,000 square feet, each with its own roll-up door, its own small office and its own tenant. An electrician. A cabinet shop. A company that installs pool equipment. An e-commerce brand that outgrew its garage. A guy who restores vintage motorcycles and keeps his business in the same bay for eleven years.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The best way we've found to explain this asset class is simple. Small-bay industrial is an apartment building for businesses.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">The apartment comparison</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Think about why multifamily became the favorite asset class of the last two decades. Investors love apartments for a handful of reasons:</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The income is spread across many tenants, so no single move-out sinks the building. Leases are short, so rents reset to market quickly when the market moves up. Demand is driven by something basic and persistent: people need somewhere to live. And value is created through operations, by managing the property better, renovating units and raising rents in line with the market.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Now look at a small-bay industrial park with forty units.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The income is spread across forty tenants. If one leaves, you lose two or three percent of your revenue, not half of it. Leases are typically one to five years, so rents get marked to market far more often than in a building with a single ten-year tenant. Demand is driven by something just as basic: the businesses that keep a local economy running need a place to park the van, store the inventory and do the work. And value is created through operations, exactly like apartments.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The difference is that the multifamily trade is crowded and well understood. Small-bay industrial is still mostly owned by local families and small operators, priced like a niche product and overlooked by the large capital that made apartments expensive.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why the demand is durable</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The tenants in our buildings are not chasing trends. They are the trades and small businesses that every growing region depends on.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When people move to Florida and Georgia, they need their homes built, wired, plumbed, cooled, landscaped and repaired. Every one of those services is run by a small business, and every one of those businesses needs a few thousand square feet with a roll-up door. When a region adds residents, it adds demand for small-bay space almost automatically.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">On top of that, a new layer of tenants has appeared over the past decade. Small e-commerce brands that need last-mile storage close to their customers. Contractors who want to be fifteen minutes from their job sites instead of an hour. Service companies that need a showroom in front and a workshop in back. None of them can use a 200,000-square-foot box. All of them can use a 2,000-square-foot bay.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why the supply isn't keeping up</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Here is the part that makes the thesis work. Very few developers build new small-bay industrial.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The reason is economics. The cost of land, permitting, construction and financing has risen sharply. For a developer, it is far more efficient to build one large building for one large tenant than to build a park of forty small units, each with its own door, its own restroom, its own utility meter and its own lease to negotiate. The per-square-foot construction cost of small-bay space is higher, the leasing is more labor-intensive, and the institutional buyers who fund most new development prefer the simplicity of big boxes.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">So the existing stock of small-bay buildings, much of it built decades ago, is what the market has. And infill land close to where people actually live is scarce and getting scarcer. A well-located small-bay building in Miami-Dade or Broward is very hard to replicate. That gives us a structural floor under the value of what we own.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Running it like apartments</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">If small-bay industrial is an apartment building for businesses, it should be operated like one. That is where our returns come from.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Unit turns.</strong> When a tenant leaves an apartment, a good operator repaints, replaces worn finishes and re-lists quickly. We do the same thing with industrial bays: clean, paint, fix the door, update the lighting, make sure the restroom works, and get the unit back on the market in days, not months.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Mark-to-market.</strong> Many small-bay buildings we buy have tenants paying rents set years ago, often on handshake renewals. As leases roll, we bring rents in line with what the market will pay. Because leases are short, this happens across the rent roll within a few years, not a decade.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Curb appeal.</strong> Small businesses care how their building looks. It's where their customers visit and their employees show up. A cleaner façade, better signage, fresh paint and good lighting translate directly into lower vacancy and stronger renewals. We treat these projects the way a multifamily operator treats a clubhouse renovation: as an investment in the product.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Tenant mix.</strong> In apartments, you screen residents. In small-bay industrial, you curate a mix. A good park balances trades, light assembly, storage and service businesses so that no single industry downturn empties the building.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;"><strong style="font-weight: 600;">Professional management.</strong> The biggest difference between a mom-and-pop small-bay park and an institutional-quality one is not the concrete. It's the management. Clear leases, consistent rent collection, quick maintenance response, monthly reporting. These are not glamorous, but they are what a future buyer pays a premium for.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">What we look for</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Our small-bay buy box is straightforward. Multi-tenant buildings from roughly 20,000 to 100,000 square feet, with bays from 1,000 to 5,000 square feet, in South Florida, Central Florida and metro Atlanta. We like grade-level doors, some dock-high loading, and light to moderate capital needs. We look for in-place rents below market and a short weighted average lease term, so we can reset income quickly. And above all we want a compelling basis: a purchase price below what it would cost to build the same building today.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When those pieces line up, the business plan writes itself. Buy below replacement cost. Fix the obvious problems. Lease the vacancy. Mark rents to market as leases roll. Professionalize the operations. Sell to a buyer who wants a stabilized, well-documented asset, typically three to five years later.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">The risks, honestly</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">No asset class is risk-free, and small-bay industrial has its own challenges. Small business tenants are less creditworthy than national companies, which is why diversification across many tenants matters so much. Management is intensive; forty tenants means forty relationships. Older buildings carry capital needs, from roofs to parking lots to electrical service. And like any real estate, values move with interest rates and the broader economy.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We don't think those risks disappear. We think they are the reason the opportunity exists. The intensity of management is exactly what keeps larger, more passive capital away, and it is exactly what a dedicated operator is built to handle.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why we keep buying</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When we walk a small-bay park, we see what a multifamily investor sees in a tired garden-style apartment complex in a growing city: good bones, real demand, rents below market and an owner who hasn't kept up.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The difference is that in apartments, everyone sees it now. In small-bay industrial, most people are still looking at the big boxes.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We're happy to keep looking at the small ones.</p>
<p style="margin: 24px 0 0; padding-top: 28px; border-top: 1.5px solid #0A0F33; font-size: 17px; line-height: 1.6; color: #55524C;">Have a building in the messy middle, or want to invest alongside us? <a href="/contact/" style="color: #2E4BE0;">Get in touch</a>.</p>
</div>
