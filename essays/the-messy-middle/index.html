<article aria-labelledby="essay-title">
<header style="border-bottom: 1px solid #0A0F33;">
<div style="max-width: 960px; margin: 0 auto; padding: clamp(64px, 8vw, 112px) 32px clamp(48px, 6vw, 72px); display: flex; flex-direction: column; gap: 28px;">
<a href="/essays/" style="align-self: flex-start; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 10px 0;">← All essays</a>
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #2E4BE0;">Strategy · November 2026 · 6 min read</p>
<h1 id="essay-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(44px, 6vw, 84px); line-height: 1.02; letter-spacing: -0.02em;">Too Big for Mom-and-Pops, Too Small for Institutions: The Messy Middle</h1>
<div style="display: flex; align-items: center; gap: 16px; padding-top: 8px;">
<img src="/assets/daniel-avatar.jpg" alt="Daniel Abrahams" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 1px solid #0A0F33;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<p style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 18px;">Daniel Abrahams</p>
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #55524C;">Founder &amp; CEO, DLA Real Estate</p>
</div>
</div>
</div>
</header>
<div style="max-width: 720px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 32px clamp(72px, 8vw, 112px); display: flex; flex-direction: column; gap: 26px;">
<p style="margin: 0; font-size: clamp(22px, 2vw, 26px); line-height: 1.55; color: #0A0F33;">Every market has a place where the big players won't go and the small players can't go. In commercial real estate, that place is the building worth somewhere between two and fifteen million dollars. It has a dozen tenants, a parking lot that needs restriping, a roof with five good years left and a rent roll that hasn't been marked to market since the owner stopped answering his phone.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We call it the messy middle. It's where DLA lives, and it's where we think the best risk-adjusted returns in American real estate are hiding.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Who owns these buildings today</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Drive any industrial corridor in South Florida or the suburbs south of Atlanta and you'll see them: a row of small warehouse bays with roll-up doors, a two-story medical office building with a dentist, a physical therapist and an insurance agent, a flex strip with a cabinet maker next to a CrossFit gym. These buildings were usually developed in the 1980s or 1990s by a local builder. Today most of them are owned by the builder's family, by a group of doctors who bought their own building twenty years ago, or by an individual who has owned the property so long that the loan was paid off before the iPhone existed.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">These owners are not bad operators. Many of them are good people who did well. But they run the building the way it was run in 1998. Leases get renewed on a handshake at last year's rent plus a little. Vacant suites sit with a faded sign in the window. Capital projects get deferred because the owner is seventy-four and doesn't want to write a check for a roof he won't be around to benefit from.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">That is not a criticism. It's an opportunity.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why the mom-and-pop buyer can't buy it</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When those owners decide to sell, the natural buyer would be someone like them: a local investor, a family office of one, a dentist who wants to own his practice's building. And for a $1 million building, that works.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">At $5 million, it stops working. A building with twelve tenants is not a passive investment. It is a small business. Someone has to collect rent from twelve different people, chase the two who are always late, re-lease the suite that goes dark every year, handle a slip-and-fall claim, rebid the landscaping contract and deal with the city when the fire marshal finds an expired extinguisher. The individual buyer with a day job doesn't have the time. The equity check is too big for most people to write alone, and the lender wants to see an operator with a track record, not a hobbyist.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">So the mom-and-pop buyer passes, or overpays and burns out three years later.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why the institution won't buy it</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">At the other end, institutional capital has never had more money looking for real estate. Pension funds, REITs and the large private equity platforms are all hungry for industrial and medical office. But they can't use a $5 million building.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The math is simple. An institutional fund that raised a billion dollars cannot deploy it five million at a time. It would need two hundred acquisitions, two hundred closings, two hundred sets of legal documents, two hundred property managers to oversee. Its cost to underwrite, close and report on a small deal is almost the same as on a large one, so small deals eat into the fee economics that pay its people. Most institutions have a minimum check size, and for many of them it starts at $25 million or more.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When they do buy small buildings, they buy them in bulk: a portfolio of forty assets assembled by someone else, priced at a premium for the convenience of buying it all at once.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">So the institution passes too.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">What's left is a market with fewer buyers</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">When neither the small buyer nor the large buyer can compete, you get something rare in a mature asset class: a segment with less competition than it deserves. Fewer bidders means better pricing. Better pricing means we can buy below replacement cost, below what it would cost to build the same building today, and below what the same rent roll would trade for once it is cleaned up and packaged for the next buyer.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">That last point matters. The messy middle is not a place we plan to stay with any one building. It is the place we buy. We fix the building, lease it up, bring rents to market, document everything to an institutional standard, and then sell it to a buyer who will pay more for a clean, stabilized asset than anyone would pay for the messy version we bought. Typically that takes three to five years.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">What "messy" actually means</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">The word is deliberate. The buildings we like have problems, and the problems are the point. A few examples from our own portfolio:</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">At a small warehouse we renovated in unincorporated Miami-Dade, everything was done except the power. The building had a three-phase panel and the utility's timeline to deliver three-phase service was months away. An institution would have waited, because its process doesn't allow for anything else. We made a call: downgrade to single-phase service, which our tenant profile didn't need, get the building powered and leased, and revisit three-phase later if a tenant ever asks for it. That's a decision you can only make if you know your tenants and you own the outcome.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">At 801 SE 6th Avenue in Delray Beach, a small medical and professional office plaza, the building's best feature was hidden behind tired paint, a dated monument sign and a parking lot that needed attention. We didn't need to tear anything down. We needed paint, lighting, landscaping and a sign that tells you the building is cared for. That kind of project doesn't show up in a spreadsheet as a big number, but tenants notice it the day they drive in.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Neither of these is a dramatic turnaround story. That's the point. The messy middle rewards a hundred small, practical decisions made quickly by people who are close to the building.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">Why an operator wins here</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Our edge in this segment is not a secret formula. It's that we are built for it.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We are small enough that a $3 million acquisition matters to us and gets the attention of our whole team. We are structured enough to underwrite, finance and report like an institution, so our investors and lenders get the documentation they expect. And we are vertically integrated: the same team that buys the building also operates it and leases it. There is no hand-off to a third-party manager who has forty other clients, no outside leasing broker who is paid the same whether he finds the right tenant or the first one.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">That alignment is the whole game in the messy middle. The value creation happens in the details, and the details only get done when the people doing them own the result.</p>
<h2 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 85%; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.01em;">The case for staying here</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We get asked whether we'll eventually "graduate" to bigger deals. Maybe, as our capital base grows. But we don't think of the messy middle as a starting point. We think of it as a structural advantage that doesn't go away.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">Every year, more of these buildings change hands as their original owners retire. Every year, institutional funds get bigger and their minimum check size rises with them. The gap between what a mom-and-pop can manage and what an institution can be bothered with is getting wider, not narrower.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">We intend to keep standing in it.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.7; color: #2A2C3A;">If you own a building in the messy middle and you're thinking about what comes next, we'd like to hear from you. And if you're an investor who wants exposure to this part of the market alongside an operator who lives in it, we'd like to hear from you too.</p>
<p style="margin: 24px 0 0; padding-top: 28px; border-top: 1.5px solid #0A0F33; font-size: 17px; line-height: 1.6; color: #55524C;">Have a building in the messy middle, or want to invest alongside us? <a href="/contact/" style="color: #2E4BE0;">Get in touch</a>.</p>
</div>
