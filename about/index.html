<h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;">About DLA Real Estate</h1>
<img src="/assets/daniel-abrahams.jpg" alt="Daniel Abrahams, Founder and CEO of DLA Real Estate" style="display: block; width: 100%; max-width: 420px; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid #0A0F33;">

<p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(30px, 3.4vw, 48px); line-height: 1.18; letter-spacing: -0.01em;">“Spreadsheets tell you what a building should earn. How you treat tenants and look after properties tells you what it will. The details compound equity.”</p>
<div style="display: flex; flex-direction: column; gap: 4px;">
<p style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 22px;">Daniel Abrahams</p>
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #55524C;">Founder &amp; CEO, DLA Real Estate</p>
</div>
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 34em; color: #3D3B37;">Daniel is the founder and CEO of DLA, a technology-powered real estate investment platform. Since 2021, DLA has acquired and managed more than 500,000 square feet of small-bay industrial, medical office and urban core commercial space from Miami to Atlanta.</p>
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 34em; color: #3D3B37;">He started his career as a fintech pioneer, founding the world's first global payments marketplace, with over $1BN traded on the platform. He also co-founded Foodstars, the first ghost kitchen operator in London, acquired by CloudKitchens in 2019. Building kitchens in ultra-urban, last-mile locations showed him the value of small, well-located space where demand is insatiable and supply is limited, a lesson he now applies to US commercial real estate.</p>
<p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 34em; color: #3D3B37;">Daniel graduated from the University of Manchester in 2010 with a First Class Honours degree in International Management. He writes DLA's essays on what it takes to run real buildings, with a firm focus on growing equity for every deal.</p>
