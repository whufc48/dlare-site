renderVals() {
const accent = this.props.accent ?? '#2E4BE0';
const st = this.state;
const pill = (on) => "min-height: 44px; padding: 0 16px; border: 1.5px solid " + (on ? "#0A0F33" : "#C9C4B8") + "; background: " + (on ? "#0A0F33" : "#FFFFFF") + "; color: " + (on ? "#F2EFE8" : "#0A0F33") + "; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;";

const multi = (key, labels) => labels.map((l) => { const on = st[key].includes(l); return { label: l, pressed: on ? 'true' : 'false', style: pill(on), pick: () => this.setState({ [key]: on ? st[key].filter((x) => x !== l) : st[key].concat(l) }) }; });
const tab = (on) => "min-height: 56px; border: none; background: " + (on ? "#0A0F33" : "transparent") + "; color: " + (on ? "#F2EFE8" : "#0A0F33") + "; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 17px; cursor: pointer;";
const isInvest = st.mode === 'invest';
return {
accent,
showForm: !st.submitted, submitted: st.submitted,
isInvest, isDeal: !isInvest,
investPressed: isInvest ? 'true' : 'false', dealPressed: isInvest ? 'false' : 'true',
investTabStyle: tab(isInvest), dealTabStyle: tab(!isInvest),
pickInvest: () => this.setState({ mode: 'invest' }),
pickDeal: () => this.setState({ mode: 'deal' }),
investorTypes: single('investorType', ['Individual', 'Family office', 'Institution', 'Other']),
interests: multi('interests', ['Industrial', 'Flex', 'Medical office', 'Credit / notes']),
roles: single('role', ['Owner', 'Broker', 'Other']),
assetTypes: single('assetType', ['Industrial', 'Flex', 'Medical office', 'Retail', 'Other']),
submitLabel: isInvest ? 'Request a call →' : 'Submit deal →',
thanksText: isInvest ? "Our team will reach out within 24 hours." : "Our team will review the details and respond within 24 hours, yes or no.",
